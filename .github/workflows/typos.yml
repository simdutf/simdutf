name: typo check

on:
  push:
    branches:
      - master
      - 9.2.x
  pull_request:
    branches:
      - master
      - 9.2.x

jobs:
  ubuntu-build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: check typos
        run: |
          sudo apt install codespell
          scripts/check_typos.sh
